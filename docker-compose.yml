name: oralhistory

services:
  db:
    image: mysql:8.0
    container_name: ${COMPOSE_PROJECT_NAME:-oralhistory}-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-oralhistory_root_pwd}
      MYSQL_DATABASE: ${DB_NAME:-oralhistory_db}
      MYSQL_USER: ${DB_USER:-oralhistory_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-oralhistory_pwd}
    ports:
      - "${DB_PORT:-10180}:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${DB_ROOT_PASSWORD:-oralhistory_root_pwd}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-oralhistory}-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-46323}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: ${COMPOSE_PROJECT_NAME:-oralhistory}-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin123}
    ports:
      - "${MINIO_PORT:-47026}:9000"
      - "${MINIO_CONSOLE_PORT:-47027}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  backend:
    build:
      context: ./backend
    container_name: ${COMPOSE_PROJECT_NAME:-oralhistory}-backend
    restart: unless-stopped
    environment:
      SERVER_PORT: "8080"
      RUN_MODE: ${RUN_MODE:-release}
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-oralhistory_db}
      DB_USER: ${DB_USER:-oralhistory_user}
      DB_PASSWORD: ${DB_PASSWORD:-oralhistory_pwd}
      JWT_SECRET: ${JWT_SECRET:-change_me_to_a_long_random_string}
      JWT_EXPIRE_HOURS: ${JWT_EXPIRE_HOURS:-72}
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ""
      REDIS_DB: "0"
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin123}
      MINIO_BUCKET: ${MINIO_BUCKET:-oralhistory-audio}
      MINIO_USE_SSL: "false"
    ports:
      - "${BACKEND_PORT:-9180}:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  frontend:
    build:
      context: ./frontend
    container_name: ${COMPOSE_PROJECT_NAME:-oralhistory}-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8180}:80"
    depends_on:
      - backend

volumes:
  db_data:
  redis_data:
  minio_data:
