openapi: 3.0.3
info:
  title: OralHistory 口述历史采集工具 API
  description: 口述历史采集工具后端接口文档（Go 1.22 + Gin + GORM）
  version: 1.0.0
servers:
  - url: http://localhost:9180/api/v1
paths:
  /auth/register:
    post:
      summary: 用户注册
      tags: [auth]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                username: { type: string }
                password: { type: string }
                display_name: { type: string }
                email: { type: string }
                role: { type: string, enum: [admin, interviewer, archivist] }
      responses:
        '200': { description: 注册成功 }
  /auth/login:
    post:
      summary: 用户登录
      tags: [auth]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        '200':
          description: 登录成功，返回 token
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
  /auth/me:
    get:
      summary: 当前用户信息
      tags: [auth]
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: 用户信息 }
  /projects:
    get:
      summary: 项目列表（status / tag / keyword 可组合筛选并保持分页；多个 tag 为 AND）
      tags: [projects]
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, default: 20, maximum: 100 } }
        - { name: status, in: query, schema: { type: string, enum: [draft, in_progress, completed, archived] } }
        - name: tag
          in: query
          description: 标签精确筛选，可重复传多个（tag=抗战&tag=知青），多标签为 AND
          schema: { type: array, items: { type: string, maxLength: 32 } }
          style: form
          explode: true
        - { name: keyword, in: query, description: 按项目标题或受访者姓名模糊搜索, schema: { type: string } }
      responses:
        '200':
          description: 分页项目列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string, example: ok }
                  data:
                    type: object
                    properties:
                      list:
                        type: array
                        items: { $ref: '#/components/schemas/Project' }
                      total: { type: integer }
                      page: { type: integer }
                      page_size: { type: integer }
    post:
      summary: 创建采访项目（tags 最多 5 个非空标签，重复标签自动合并，含空或超限返回 HTTP 400（业务码 42200））
      tags: [projects]
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateProjectRequest' }
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Project' }
        '400': { description: 标签含空元素或去重后超过 5 个（业务码 code=42200） }
  /projects/{id}:
    get:
      summary: 项目详情（含 tags）
      tags: [projects]
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: 项目详情
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Project' }
    put:
      summary: 更新项目（已归档项目返回 409 只读；body 不带 tags 字段时保留原标签，tags 为 [] 时清空）
      tags: [projects]
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProjectRequest' }
      responses:
        '200': { description: 更新成功 }
        '409': { description: 项目已归档，只读 }
        '400': { description: 标签含空元素或去重后超过 5 个（业务码 code=42200） }
    delete: { summary: 删除项目, tags: [projects], security: [{ BearerAuth: [] }] }
  /projects/{id}/status:
    put:
      summary: 项目状态流转
      tags: [projects]
      security: [{ BearerAuth: [] }]
  /projects/{projectId}/questions:
    get: { summary: 项目问题列表, tags: [questions], security: [{ BearerAuth: [] }] }
    post: { summary: 添加问题, tags: [questions], security: [{ BearerAuth: [] }] }
  /questions/{id}:
    put: { summary: 更新问题, tags: [questions], security: [{ BearerAuth: [] }] }
    delete: { summary: 删除问题, tags: [questions], security: [{ BearerAuth: [] }] }
  /recordings:
    get:
      summary: 录音列表（project_id 或 question_id）
      tags: [recordings]
      security: [{ BearerAuth: [] }]
    post: { summary: 创建录音记录, tags: [recordings], security: [{ BearerAuth: [] }] }
  /recordings/{id}:
    get: { summary: 录音详情, tags: [recordings], security: [{ BearerAuth: [] }] }
    put: { summary: 更新录音, tags: [recordings], security: [{ BearerAuth: [] }] }
    delete: { summary: 删除录音, tags: [recordings], security: [{ BearerAuth: [] }] }
  /recordings/{id}/audio:
    post: { summary: 上传录音文件(multipart), tags: [recordings], security: [{ BearerAuth: [] }] }
    get: { summary: 播放录音音频流, tags: [recordings], security: [{ BearerAuth: [] }] }
  /timeline-markers:
    get:
      summary: 时间轴节点列表（project_id 或 recording_id）
      tags: [timeline]
      security: [{ BearerAuth: [] }]
    post: { summary: 标注时间轴节点, tags: [timeline], security: [{ BearerAuth: [] }] }
  /timeline-markers/{id}:
    put: { summary: 更新时间轴节点, tags: [timeline], security: [{ BearerAuth: [] }] }
    delete: { summary: 删除时间轴节点, tags: [timeline], security: [{ BearerAuth: [] }] }
  /audit-logs:
    get:
      summary: 审计日志列表（仅管理员）
      tags: [audit]
      security: [{ BearerAuth: [] }]
  /users:
    get: { summary: 用户列表（仅管理员）, tags: [users], security: [{ BearerAuth: [] }] }
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Project:
      type: object
      properties:
        id: { type: integer }
        title: { type: string, maxLength: 128 }
        interviewee_name: { type: string, maxLength: 64 }
        birth_year: { type: integer, minimum: 1900, maximum: 2100 }
        background: { type: string }
        status: { type: string, enum: [draft, in_progress, completed, archived] }
        tags:
          type: array
          description: 标签名列表；旧数据无标签时返回 []
          items: { type: string, maxLength: 32 }
          maxItems: 5
        created_by: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateProjectRequest:
      type: object
      required: [title, interviewee_name, birth_year]
      properties:
        title: { type: string, maxLength: 128 }
        interviewee_name: { type: string, maxLength: 64 }
        birth_year: { type: integer, minimum: 1900, maximum: 2100 }
        background: { type: string, maxLength: 2000 }
        status: { type: string, enum: [draft, in_progress, completed, archived] }
        tags:
          type: array
          description: 最多 5 个非空标签，服务端自动去空白并合并重复标签；含空或超限返回 HTTP 400（业务码 42200）
          items: { type: string, maxLength: 32 }
          maxItems: 5
    UpdateProjectRequest:
      type: object
      description: 所有字段均可选；不传 tags 字段保留原标签，传 [] 清空标签
      properties:
        title: { type: string, maxLength: 128 }
        interviewee_name: { type: string, maxLength: 64 }
        birth_year: { type: integer, minimum: 1900, maximum: 2100 }
        background: { type: string, maxLength: 2000 }
        tags:
          type: array
          items: { type: string, maxLength: 32 }
          maxItems: 5
